<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Taskify</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Taskify</span>
      <button id="logout-btn" class="btn btn-secondary btn-small">Log out</button>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <h1 id="welcome-title">Welcome</h1>
      <p>Here's what's on your plate.</p>
    </section>

    <section class="stats">
      <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
      <div class="stat"><strong id="stat-pending">0</strong><span>Pending</span></div>
      <div class="stat"><strong id="stat-done">0</strong><span>Completed</span></div>
    </section>

    <section class="toolbar">
      <input id="search-input" type="search" placeholder="Search tasks" aria-label="Search tasks">
      <select id="status-filter" aria-label="Filter by status">
        <option value="all">All tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <button id="add-btn" class="btn btn-primary">Add task</button>
    </section>

    <div id="page-message" class="message error hidden" role="alert"></div>
    <section id="task-list" class="task-list" aria-live="polite"></section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form" novalidate>
      <h2 id="dialog-title">Add task</h2>
      <label for="task-title">Title</label>
      <input id="task-title" type="text">
      <label for="task-description">Description</label>
      <textarea id="task-description"></textarea>
      <div class="check-row">
        <input id="task-completed" type="checkbox">
        <label for="task-completed">Mark as completed</label>
      </div>
      <div id="dialog-message" class="message error hidden" role="alert"></div>
      <div class="dialog-buttons">
        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
