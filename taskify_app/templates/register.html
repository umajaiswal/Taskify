<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join StudySpace — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-a: #e0e7ff;
            --bg-b: #f0e6ff;
            --bg-c: #fde8f5;
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent: #ec4899;
            --accent2: #06b6d4;
            --text: #1e1b4b;
            --muted: #6b7280;
            --card: rgba(255,255,255,0.72);
            --border: rgba(167,139,250,0.3);
            --success: #10b981;
            --error: #ef4444;
            --shadow: 0 20px 60px rgba(124,58,237,0.15), 0 4px 16px rgba(0,0,0,0.06);
        }

        body {
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Floating shapes background ── */
        .bg-shapes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
        }
        .s1 { width: 340px; height: 340px; background: var(--primary-light); top: -80px; left: -80px;
              animation: floatA 9s ease-in-out infinite; }
        .s2 { width: 220px; height: 220px; background: var(--accent); bottom: 40px; right: -60px;
              animation: floatB 11s ease-in-out infinite; }
        .s3 { width: 120px; height: 120px; background: var(--accent2); top: 55%; left: 8%;
              animation: floatA 7s ease-in-out infinite 2s; }
        .s4 { width: 80px; height: 80px; background: var(--primary); top: 20%; right: 12%;
              border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
              animation: floatB 8s ease-in-out infinite 1s; }
        .s5 { width: 50px; height: 50px; background: var(--accent); top: 75%; left: 40%;
              animation: spin 18s linear infinite; border-radius: 6px; opacity: 0.12; }

        @keyframes floatA {
            0%,100% { transform: translate(0,0) scale(1); }
            50%      { transform: translate(18px,-22px) scale(1.06); }
        }
        @keyframes floatB {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            50%      { transform: translate(-14px,16px) rotate(20deg); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Tiny floating stars */
        .star {
            position: absolute;
            width: 6px; height: 6px;
            background: var(--primary);
            clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
            opacity: 0.22;
            animation: twinkle 4s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%,100% { opacity: 0.22; transform: scale(1); }
            50%      { opacity: 0.55; transform: scale(1.4); }
        }

        /* ── Wrapper ── */
        .page-wrap {
            position: relative; z-index: 10;
            display: flex;
            align-items: center;
            gap: 32px;
            max-width: 920px;
            width: 100%;
            animation: pageRise 0.8s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes pageRise {
            from { opacity: 0; transform: translateY(36px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Mascot panel ── */
        .mascot-side {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .mascot-bubble {
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary-dark);
            box-shadow: 0 4px 20px rgba(124,58,237,0.15);
            position: relative;
            animation: bubblePop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.9s both;
        }
        .mascot-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: white;
            border-bottom: 0;
        }
        @keyframes bubblePop {
            from { opacity: 0; transform: scale(0.6) translateY(-10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* SVG mascot — student girl */
        .mascot-svg {
            animation: mascotBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 12px 24px rgba(124,58,237,0.25));
        }
        @keyframes mascotBounce {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        .arm-wave {
            transform-origin: 20px 10px;
            animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
            0%,100% { transform: rotate(0deg); }
            25%      { transform: rotate(-22deg); }
            75%      { transform: rotate(14deg); }
        }

        .eye-blink {
            animation: blink 4s ease-in-out infinite;
        }
        @keyframes blink {
            0%,90%,100% { transform: scaleY(1); }
            95%          { transform: scaleY(0.08); }
        }

        .mascot-tag {
            font-family: 'Baloo 2', cursive;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-dark);
            opacity: 0.85;
            letter-spacing: 0.02em;
        }

        /* ── Card ── */
        .card {
            flex: 1;
            background: var(--card);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 28px;
            border: 1.5px solid var(--border);
            padding: 44px 42px 36px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-light), var(--accent), var(--accent2), var(--primary-light));
            background-size: 200%;
            animation: gradShift 4s linear infinite;
        }
        @keyframes gradShift { to { background-position: 200% 0; } }

        /* Heading */
        .card-head { margin-bottom: 28px; }
        .card-head h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.15;
        }
        .card-head h1 span { color: var(--primary); }
        .card-head p { margin-top: 4px; font-size: 0.875rem; color: var(--muted); font-weight: 500; }

        /* Error */
        .error-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff0f0;
            border: 1.5px solid #fecaca;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--error);
            font-weight: 600;
            margin-bottom: 18px;
            animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
        }
        @keyframes shake {
            10%,90% { transform: translateX(-2px); }
            20%,80% { transform: translateX(4px); }
            30%,50%,70% { transform: translateX(-4px); }
            40%,60% { transform: translateX(4px); }
        }

        /* Form grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 16px;
        }
        .full { grid-column: 1 / -1; }

        /* Field */
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color 0.25s;
        }
        .field:focus-within label { color: var(--primary); }

        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon {
            position: absolute; left: 12px;
            color: #c4b5fd;
            pointer-events: none;
            transition: color 0.25s;
        }
        .field:focus-within .input-icon { color: var(--primary); }

        .field input {
            width: 100%;
            padding: 11px 12px 11px 38px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            background: rgba(255,255,255,0.9);
            border: 1.5px solid rgba(196,181,253,0.5);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .field input::placeholder { color: #c4b5fd; font-weight: 500; }
        .field input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
            background: white;
        }
        .field input.valid   { border-color: var(--success); }
        .field input.invalid { border-color: var(--error); }

        .pw-toggle {
            position: absolute; right: 10px;
            background: none; border: none; cursor: pointer;
            color: #c4b5fd; padding: 4px;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--primary); }

        /* Strength bar */
        .strength-bar { display: flex; gap: 4px; margin-top: 4px; }
        .strength-seg {
            flex: 1; height: 4px; border-radius: 4px;
            background: rgba(196,181,253,0.25);
            transition: background 0.3s;
        }
        .strength-seg.weak   { background: #f87171; }
        .strength-seg.medium { background: #fbbf24; }
        .strength-seg.strong { background: var(--success); }

        /* Submit */
        .submit-btn {
            margin-top: 6px;
            width: 100%;
            padding: 14px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 6px 24px rgba(124,58,237,0.35);
        }
        .submit-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--primary-dark), #be185d);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(124,58,237,0.45); }
        .submit-btn:hover::before { opacity: 1; }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn span { position: relative; z-index: 1; }

        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* Footer */
        .card-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }
        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            position: relative;
        }
        .card-footer a::after {
            content: '';
            position: absolute; bottom: -1px; left: 0; right: 0;
            height: 2px; background: var(--primary);
            transform: scaleX(0); transform-origin: right;
            transition: transform 0.3s;
        }
        .card-footer a:hover::after { transform: scaleX(1); transform-origin: left; }

        /* ── Responsive ── */
        @media (max-width: 780px) {
            .page-wrap { flex-direction: column; gap: 0; }
            .mascot-side { flex-direction: row; flex: unset; width: 100%; justify-content: center; gap: 16px; }
            .mascot-svg { width: 120px; height: auto; }
            .mascot-bubble { font-size: 0.75rem; }
            .mascot-bubble::after { display: none; }
            .mascot-tag { display: none; }
            .card { padding: 32px 24px 28px; }
            .form-grid { grid-template-columns: 1fr; }
            .full { grid-column: 1; }
        }
        @media (max-width: 420px) {
            .card-head h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Background shapes -->
<div class="bg-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <!-- Stars -->
    <div class="star" style="top:12%;left:22%;animation-delay:0s"></div>
    <div class="star" style="top:70%;left:75%;animation-delay:1.2s;width:9px;height:9px"></div>
    <div class="star" style="top:30%;right:6%;animation-delay:0.6s"></div>
    <div class="star" style="bottom:15%;left:16%;animation-delay:1.8s;width:7px;height:7px"></div>
    <div class="star" style="top:48%;left:5%;animation-delay:2.4s;width:5px;height:5px"></div>
</div>

<div class="page-wrap">

    <!-- ── Mascot ── -->
    <div class="mascot-side">
        <div class="mascot-bubble">Hi there! 👋 Let's get you started!</div>

        <!-- Inline SVG student girl mascot -->
        <svg class="mascot-svg" width="210" height="280" viewBox="0 0 210 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="skinGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fde8c8"/>
                    <stop offset="100%" stop-color="#f5c98a"/>
                </radialGradient>
                <radialGradient id="shirtGrad" cx="50%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#a78bfa"/>
                    <stop offset="100%" stop-color="#7c3aed"/>
                </radialGradient>
                <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
                    <stop offset="0%" stop-color="#4c2a8a"/>
                    <stop offset="100%" stop-color="#1e1b4b"/>
                </radialGradient>
            </defs>

            <!-- Shadow -->
            <ellipse cx="105" cy="268" rx="52" ry="8" fill="rgba(124,58,237,0.12)"/>

            <!-- Body / shirt -->
            <rect x="60" y="158" width="90" height="82" rx="20" fill="url(#shirtGrad)"/>
            <!-- Collar details -->
            <polygon points="105,162 90,175 105,185 120,175" fill="white" opacity="0.25"/>

            <!-- Left arm (static) -->
            <rect x="32" y="162" width="30" height="18" rx="9" fill="url(#shirtGrad)" transform="rotate(15,32,162)"/>
            <!-- Left hand -->
            <circle cx="30" cy="192" r="12" fill="url(#skinGrad)"/>

            <!-- Right arm (waving) -->
            <g class="arm-wave">
                <rect x="148" y="158" width="30" height="18" rx="9" fill="url(#shirtGrad)" transform="rotate(-10,148,158)"/>
                <!-- Right hand -->
                <circle cx="178" cy="152" r="13" fill="url(#skinGrad)"/>
                <!-- Waving fingers hint -->
                <line x1="172" y1="142" x2="170" y2="136" stroke="#f5c98a" stroke-width="3" stroke-linecap="round"/>
                <line x1="178" y1="140" x2="177" y2="134" stroke="#f5c98a" stroke-width="3" stroke-linecap="round"/>
                <line x1="184" y1="143" x2="184" y2="137" stroke="#f5c98a" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Skirt -->
            <path d="M60 226 Q55 248 58 258 Q105 270 152 258 Q155 248 150 226 Z" fill="#ec4899" opacity="0.85"/>
            <!-- Skirt shine -->
            <path d="M70 228 Q68 242 70 252 Q90 260 105 260" stroke="white" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>

            <!-- Legs -->
            <rect x="82" y="255" width="18" height="22" rx="9" fill="url(#skinGrad)"/>
            <rect x="110" y="255" width="18" height="22" rx="9" fill="url(#skinGrad)"/>
            <!-- Shoes -->
            <ellipse cx="91" cy="276" rx="14" ry="6" fill="#1e1b4b"/>
            <ellipse cx="119" cy="276" rx="14" ry="6" fill="#1e1b4b"/>

            <!-- Neck -->
            <rect x="96" y="143" width="18" height="20" rx="8" fill="url(#skinGrad)"/>

            <!-- Head -->
            <ellipse cx="105" cy="118" rx="44" ry="44" fill="url(#skinGrad)"/>

            <!-- Hair back layer -->
            <ellipse cx="105" cy="100" rx="46" ry="38" fill="url(#hairGrad)"/>
            <!-- Hair side strands -->
            <path d="M61 108 Q52 130 55 150 Q62 145 65 135 Q68 120 68 108 Z" fill="url(#hairGrad)"/>
            <path d="M149 108 Q158 130 155 150 Q148 145 145 135 Q142 120 142 108 Z" fill="url(#hairGrad)"/>
            <!-- Hair top -->
            <ellipse cx="105" cy="82" rx="44" ry="20" fill="url(#hairGrad)"/>
            <!-- Fringe -->
            <path d="M68 94 Q78 80 105 78 Q132 80 142 94 Q130 86 105 86 Q80 86 68 94 Z" fill="#2d1b69"/>

            <!-- Ear -->
            <ellipse cx="61" cy="120" rx="7" ry="10" fill="url(#skinGrad)"/>
            <ellipse cx="149" cy="120" rx="7" ry="10" fill="url(#skinGrad)"/>

            <!-- Eyes -->
            <g class="eye-blink">
                <!-- Left eye white -->
                <ellipse cx="91" cy="120" rx="10" ry="11" fill="white"/>
                <!-- Right eye white -->
                <ellipse cx="119" cy="120" rx="10" ry="11" fill="white"/>
                <!-- Pupils -->
                <circle cx="91" cy="122" r="6" fill="#1e1b4b"/>
                <circle cx="119" cy="122" r="6" fill="#1e1b4b"/>
                <!-- Iris shine -->
                <circle cx="94" cy="119" r="2.5" fill="#7c3aed" opacity="0.7"/>
                <circle cx="122" cy="119" r="2.5" fill="#7c3aed" opacity="0.7"/>
                <!-- Eye highlight -->
                <circle cx="96" cy="117" r="1.5" fill="white"/>
                <circle cx="124" cy="117" r="1.5" fill="white"/>
            </g>

            <!-- Eyebrows -->
            <path d="M82 108 Q91 104 100 107" stroke="#2d1b69" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M110 107 Q119 104 128 108" stroke="#2d1b69" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- Nose -->
            <path d="M103 128 Q105 133 107 128" stroke="#e0a96d" stroke-width="1.8" fill="none" stroke-linecap="round"/>

            <!-- Smile -->
            <path d="M92 138 Q105 148 118 138" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Cheek blush -->
            <ellipse cx="81" cy="134" rx="9" ry="6" fill="#f9a8d4" opacity="0.45"/>
            <ellipse cx="129" cy="134" rx="9" ry="6" fill="#f9a8d4" opacity="0.45"/>

            <!-- Hair accessory — star clip -->
            <g transform="translate(130,82)">
                <polygon points="0,-9 2,-3 9,-3 4,2 6,8 0,4 -6,8 -4,2 -9,-3 -2,-3"
                         fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
            </g>

            <!-- Book under left arm -->
            <rect x="22" y="194" width="28" height="36" rx="4" fill="#06b6d4" opacity="0.9"/>
            <rect x="24" y="196" width="24" height="3" rx="1.5" fill="white" opacity="0.4"/>
            <rect x="24" y="202" width="24" height="2" rx="1" fill="white" opacity="0.3"/>
            <rect x="24" y="207" width="16" height="2" rx="1" fill="white" opacity="0.3"/>
            <rect x="24" y="212" width="20" height="2" rx="1" fill="white" opacity="0.3"/>

            <!-- Pencil behind ear -->
            <rect x="148" y="95" width="5" height="22" rx="2" fill="#fbbf24" transform="rotate(15,148,95)"/>
            <polygon points="150,117 153,117 151.5,122" fill="#f5c98a" transform="rotate(15,148,95)"/>
        </svg>

        <p class="mascot-tag">✨ StudySpace</p>
    </div>

    <!-- ── Card ── -->
    <div class="card">
        <div class="card-head">
            <h1>Create your <span>account</span> 🎓</h1>
            <p>Join thousands of students leveling up their productivity!</p>
        </div>

        {% if error %}
        <div class="error-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" id="registerForm">
            {% csrf_token %}

            <div class="form-grid">

                <!-- Username -->
                <div class="field full">
                    <label for="user_name">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input id="user_name" name="user_name" type="text" placeholder="coolstudent42" required autocomplete="username">
                    </div>
                </div>

                <!-- Email -->
                <div class="field full">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input id="email" name="email" type="email" placeholder="you@university.edu" required autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="field full">
                    <label for="user_password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input id="user_password" name="user_password" type="password" placeholder="Create a strong password" required autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-target="user_password">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <!-- Strength bar -->
                    <div class="strength-bar" id="strengthBar">
                        <div class="strength-seg" id="seg1"></div>
                        <div class="strength-seg" id="seg2"></div>
                        <div class="strength-seg" id="seg3"></div>
                        <div class="strength-seg" id="seg4"></div>
                    </div>
                </div>

                
                <!-- Submit -->
                <div class="full">
                    <button class="submit-btn" type="submit" id="submitBtn">
                        <span>🚀 Create my account</span>
                    </button>
                </div>
            </div>
        </form>

        <div class="card-footer">
            <p>Already have an account? <a href="/login">Sign in here →</a></p>
        </div>
    </div>
</div>

<script>
    // Password toggle
    document.querySelectorAll('.pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const inp = document.getElementById(btn.dataset.target);
            const isPass = inp.type === 'password';
            inp.type = isPass ? 'text' : 'password';
            btn.innerHTML = isPass
                ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
    });

    // Password strength
    const pwInput = document.getElementById('user_password');
    const segs = [document.getElementById('seg1'), document.getElementById('seg2'),
                  document.getElementById('seg3'), document.getElementById('seg4')];

    function calcStrength(pw) {
        let s = 0;
        if (pw.length >= 8)  s++;
        if (/[A-Z]/.test(pw)) s++;
        if (/[0-9]/.test(pw)) s++;
        if (/[^A-Za-z0-9]/.test(pw)) s++;
        return s;
    }

    pwInput.addEventListener('input', () => {
        const s = calcStrength(pwInput.value);
        segs.forEach((seg, i) => {
            seg.className = 'strength-seg';
            if (i < s) {
                seg.classList.add(s <= 1 ? 'weak' : s <= 2 ? 'medium' : 'strong');
            }
        });
    });

    // Confirm match feedback
    const confirmInput = document.getElementById('confirm_password');
    confirmInput.addEventListener('input', () => {
        if (!confirmInput.value) { confirmInput.className = ''; return; }
        confirmInput.classList.toggle('valid',   confirmInput.value === pwInput.value);
        confirmInput.classList.toggle('invalid', confirmInput.value !== pwInput.value);
    });

    // Ripple
    document.getElementById('submitBtn').addEventListener('click', function(e) {
        const r = document.createElement('span');
        const d = Math.max(this.clientWidth, this.clientHeight);
        const rect = this.getBoundingClientRect();
        r.className = 'ripple';
        r.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-rect.left-d/2}px;top:${e.clientY-rect.top-d/2}px;`;
        this.querySelector('.ripple')?.remove();
        this.appendChild(r);
    });

    // Client-side form check
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const pw  = pwInput.value;
        const cpw = confirmInput.value;
        if (pw !== cpw) {
            e.preventDefault();
            let err = document.querySelector('.error-box');
            if (!err) {
                err = document.createElement('div');
                err.className = 'error-box';
                err.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Passwords do not match!';
                document.querySelector('.card-head').after(err);
            } else {
                err.style.animation = 'none';
                err.offsetHeight;
                err.style.animation = '';
            }
        }
    });
</script>
</body>
</html>
