<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Welcome Back</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0f0e17;
            --cream: #fffcf5;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --dust: #e8e2d6;
            --muted: #8a8070;
            --card-bg: rgba(255, 252, 245, 0.85);
            --shadow: 0 32px 80px rgba(15,14,23,0.18), 0 4px 16px rgba(15,14,23,0.08);
        }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-canvas {
            position: fixed; inset: 0; z-index: 0;
            background: #0f0e17;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: drift linear infinite;
        }
        .orb-1 { width: 520px; height: 520px; background: #4a2f6e; top: -120px; left: -100px; animation-duration: 18s; }
        .orb-2 { width: 400px; height: 400px; background: #7c4d2a; bottom: -80px; right: -80px; animation-duration: 22s; animation-direction: reverse; }
        .orb-3 { width: 260px; height: 260px; background: #c9a84c; top: 40%; left: 60%; animation-duration: 14s; }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(40px, -30px) scale(1.06); }
            66%  { transform: translate(-30px, 40px) scale(0.96); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Geometric lines */
        .lines {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }
        .lines::before, .lines::after {
            content: '';
            position: absolute;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.2), transparent);
        }
        .lines::before { height: 100%; left: 20%; top: 0; animation: lineFade 6s ease-in-out infinite; }
        .lines::after  { height: 100%; right: 20%; top: 0; animation: lineFade 6s ease-in-out infinite 3s; }

        @keyframes lineFade {
            0%, 100% { opacity: 0.3; }
            50%       { opacity: 0.9; }
        }

        /* Card */
        .card-wrap {
            position: relative; z-index: 10;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 24px;
            padding: 52px 48px 44px;
            width: min(420px, 92vw);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        /* Gold accent top bar */
        .card-accent {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,100% { opacity: 0.7; }
            50%      { opacity: 1; }
        }

        /* Logo mark */
        .logo-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }
        .logo-ring {
            width: 54px; height: 54px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .logo-ring::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #8b6914);
            opacity: 0.15;
        }
        .logo-ring svg { color: var(--gold); z-index: 1; }

        /* Heading */
        .heading-group { margin-bottom: 36px; animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both; }
        .heading-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        .heading-group p {
            margin-top: 6px;
            font-size: 0.875rem;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* Error message */
        .error-box {
            background: #fff0f0;
            border: 1px solid #f5c6c6;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #b94040;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Fields */
        .field-group { display: flex; flex-direction: column; gap: 20px; margin-bottom: 28px; }

        .field { position: relative; animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .field:nth-child(1) { animation-delay: 0.3s; }
        .field:nth-child(2) { animation-delay: 0.38s; }

        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        .field:focus-within label { color: var(--gold); }

        .input-wrap {
            position: relative;
            display: flex; align-items: center;
        }

        .input-icon {
            position: absolute; left: 14px;
            color: var(--muted);
            transition: color 0.3s;
            pointer-events: none;
            display: flex; align-items: center;
        }
        .field:focus-within .input-icon { color: var(--gold); }

        .field input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.93rem;
            font-weight: 400;
            color: var(--ink);
            background: white;
            border: 1.5px solid var(--dust);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            letter-spacing: 0.01em;
        }
        .field input::placeholder { color: #bbb; font-weight: 300; }
        .field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
            background: #fffef8;
        }

        /* Toggle password */
        .toggle-pw {
            position: absolute; right: 12px;
            background: none; border: none;
            cursor: pointer; color: var(--muted);
            display: flex; align-items: center;
            padding: 4px; transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--gold); }

        /* Submit button */
        .submit-wrap { animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.46s both; }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(201,168,76,0.35);
        }
        .login-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--gold), #a07820);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,76,0.45); }
        .login-btn:hover::before { opacity: 1; }
        .login-btn:active { transform: translateY(0); }
        .login-btn span { position: relative; z-index: 1; }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Footer links */
        .card-footer {
            margin-top: 24px;
            text-align: center;
            animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.54s both;
        }
        .card-footer p { font-size: 0.82rem; color: var(--muted); font-weight: 300; }
        .card-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }
        .card-footer a::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform 0.25s;
        }
        .card-footer a:hover::after { transform: scaleX(1); }

        .divider {
            margin: 0 8px;
            color: var(--dust);
        }

        /* Floating particles */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: var(--gold);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.4; }
            90%  { opacity: 0.1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 40px 28px 36px; }
            .heading-group h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="lines"></div>

<!-- Particles (JS-injected) -->

<!-- Card -->
<div class="card-wrap">
    <div class="login-card">
        <div class="card-accent"></div>

        <!-- Logo -->
        <div class="logo-mark">
            <div class="logo-ring">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <div class="heading-group">
            <h1>Welcome back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <!-- Error (Django template block preserved) -->
        {% if error %}
        <div class="error-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <div class="field-group">
                <!-- Username -->
                <div class="field">
                    <label for="user_name">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input id="user_name" name="user_name" type="text" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="user_password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input id="user_password" name="user_password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="submit-wrap">
                <button class="login-btn" type="submit" id="loginBtn">
                    <span>Sign In</span>
                </button>
            </div>
        </form>

        <div class="card-footer">
            <p>
                <a href="#" id="forgotLink">Forgot password?</a>
                <span class="divider">·</span>
                <a href="/register/">Create account</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Password toggle
    const togglePw = document.getElementById('togglePw');
    const pwInput  = document.getElementById('user_password');
    const eyeIcon  = document.getElementById('eyeIcon');
    const eyeOffSVG = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    const eyeOnSVG  = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;

    togglePw.addEventListener('click', () => {
        const isPass = pwInput.type === 'password';
        pwInput.type = isPass ? 'text' : 'password';
        eyeIcon.innerHTML = isPass ? eyeOffSVG : eyeOnSVG;
    });

    // Ripple on button
    document.getElementById('loginBtn').addEventListener('click', function(e) {
        const btn = this;
        const circle = document.createElement('span');
        const diameter = Math.max(btn.clientWidth, btn.clientHeight);
        const rect = btn.getBoundingClientRect();
        circle.className = 'ripple';
        circle.style.cssText = `width:${diameter}px;height:${diameter}px;left:${e.clientX-rect.left-diameter/2}px;top:${e.clientY-rect.top-diameter/2}px;`;
        btn.querySelector('.ripple')?.remove();
        btn.appendChild(circle);
    });

    // Floating particles
    function spawnParticle() {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.cssText = `
            width:${size}px; height:${size}px;
            left:${Math.random()*100}vw;
            animation-duration:${Math.random()*10+10}s;
            animation-delay:${Math.random()*8}s;
            opacity: 0;
        `;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 20000);
    }
    for (let i = 0; i < 18; i++) spawnParticle();
    setInterval(spawnParticle, 2500);

    // Forgot password feedback
    document.getElementById('forgotLink').addEventListener('click', e => {
        e.preventDefault();
        alert('Password reset link will be sent to your registered email.');
    });
</script>
</body>
</html>
